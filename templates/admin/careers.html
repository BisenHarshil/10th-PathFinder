{% extends "base.html" %}{% block title %}Admin Careers{% endblock %}
{% block content %}<main class="container"><div class="page-head"><h1>Manage careers</h1></div><div class="admin-nav"><a href="{{url_for('admin')}}">Dashboard</a><a href="{{url_for('admin_questions')}}">Quiz Questions</a></div>
<div class="two-col"><form class="card" method="post"><h2>Add career</h2><label>Name</label><input name="name" required><label>Description</label><input name="description" required><label>Subjects</label><input name="subjects" placeholder="Maths, Physics"><label>Skills</label><input name="skills" placeholder="Problem solving, coding"><label>Icon</label><input name="icon" value="◎"><label>Stream</label><select name="stream_id"><option value="">None</option>{% for s in streams %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><label><input type="checkbox" name="featured"> Featured</label><button class="btn btn-primary" style="margin-top:15px">Add Career</button></form>
<div class="card"><h2>Current careers</h2><div class="list">{% for c in careers %}<div class="list-row"><span><b>{{c.name}}</b><br><small class="muted">{{c.stream_name or ''}}</small></span><span>{{c.icon}}</span></div>{% endfor %}</div></div></div></main>{% endblock %}
